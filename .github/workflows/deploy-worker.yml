name: Deploy woolet-route-server

on:
  push:
    branches: [main]
    paths:
      - 'workers/route-server/**'
      - 'src/**'
      - 'public/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install worker dependencies
        run: npm install
        working-directory: workers/route-server

      - name: Deploy worker
        run: npm run deploy
        working-directory: workers/route-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
