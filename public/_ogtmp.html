<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Corm';src:url('/fonts/cormorant-normal-latin.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Barl';src:url('/fonts/barlow-500-latin.woff2') format('woff2');font-weight:500;}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0B0A09;position:relative;overflow:hidden}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:620px;border-radius:50%;
background:radial-gradient(circle,rgba(194,160,90,0.16) 0%,rgba(194,160,90,0.05) 42%,rgba(11,10,9,0) 70%);}
.wrap{position:absolute;inset:0;padding:78px 88px;display:flex;flex-direction:column;justify-content:space-between}
.kicker{font-family:'Barl',sans-serif;font-size:16px;letter-spacing:4.4px;color:#C2A05A;text-transform:uppercase}
.mid{margin-top:auto;margin-bottom:auto}
.rule{width:64px;height:2px;background:#C2A05A;opacity:.85;margin-bottom:34px}
h1{font-family:'Corm',serif;font-weight:400;font-size:62px;line-height:1.15;color:#EFE9DF;max-width:930px;letter-spacing:.2px}
.foot{font-family:'Barl',sans-serif;font-size:14px;letter-spacing:2.4px;color:#8C857A;text-transform:uppercase}
.foot b{color:#C2A05A;font-weight:500}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="kicker">Woolet Journal · Wide-Fit Eyewear</div>
  <div class="mid"><div class="rule"></div>
  <h1>Oversized vs Wide-Fit<br>Blue Light Glasses: 158 mm</h1></div>
  <div class="foot"><b>woolet.co/en/blog/oversized-blue-light-glasses-vs-wide-fit</b></div>
</div></body></html>
